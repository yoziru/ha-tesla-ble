name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Explicit version override (X.Y.Z)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require main and release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Run releases from main only" >&2
            exit 1
          fi
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "Set the repository secret RELEASE_TOKEN" >&2
            exit 1
          fi

      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Bump, validate, merge and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: python3 scripts/release.py
