name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Home Assistant runtime tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check custom_components tests scripts
      - run: uv run --no-sync ruff format --check custom_components tests scripts
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest tests -q
