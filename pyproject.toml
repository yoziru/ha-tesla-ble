[project]
name = "ha-tesla-ble-dev"
version = "0.1.0"
description = "Development tooling for the Tesla BLE Home Assistant integration"
requires-python = ">=3.14.2"
license = "AGPL-3.0-only"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.371",
    "bleak-retry-connector>=4.7.1",
    "tesla-ble==6.2.0",
    "ruff>=0.14",
    "mypy>=2.4",
    # The bluetooth test fixtures import HA's usb component, which imports
    # these at module level. Versions mirror HA's usb and bluetooth
    # integration manifests; dbus-fast is normally Linux-only via markers,
    # but the macOS test path loads adapter history through it too.
    "aiousbwatcher==1.1.2",
    "serialx==1.14.0",
    "dbus-fast==5.0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
strict = true
follow_imports = "silent"
files = [
    "custom_components/tesla_ble/ble.py",
    "custom_components/tesla_ble/storage.py",
    "custom_components/tesla_ble/const.py",
]
